  <!-- Primary SEO Meta Tags -->
  <title>QueErp | Enterprise Cloud ERP, Invoicing &amp; Financial Management Platform</title>
  <meta name="description" content="QueErp is an all-in-one enterprise cloud ERP platform by Que Information Technology. Streamline accounting, UAE FTA VAT compliance, CRM, multi-warehouse inventory, and project operations." />

  <link rel="canonical" href="https://erp.queinfotech.com/" />

  <!-- Open Graph / Facebook -->

  <meta property="og:site_name" content="QueErp" />
  <meta property="og:url" content="https://erp.queinfotech.com/" />
  <meta property="og:title" content="QueErp | Enterprise Cloud ERP &amp; Financial Management Platform" />

  <meta property="og:image" content="https://www.queinfotech.com/images/og-default.png" />

  <!-- Twitter Card -->

  <!-- Structured Data: SoftwareApplication Schema -->
  <script type="application/ld+json">

    "@context": "https://schema.org",

    "name": "QueErp",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Cloud, Web Browser",
    "url": "https://erp.queinfotech.com/",
    "author": {
      "@type": "Organization",
      "name": "Que Information Technology",
      "url": "https://www.queinfotech.com"
    },
    "description": "Enterprise cloud ERP system featuring automated accounting, invoicing, inventory tracking, CRM, and project management.",
    "offers": {
      "@type": "Offer",
      "price": "7.00",
      "priceCurrency": "USD",
      "availability": "https://schema.org/InStock"
    }
  }
  </script>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
